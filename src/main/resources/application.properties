# ===================================================================
# Gestionale Paola - Quarkus Application Configuration
# ===================================================================

# HTTP Configuration
quarkus.http.port=8080

# ===================================================================
# Production / Default Datasource Configuration (PostgreSQL)
# ===================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:gestionale}
quarkus.datasource.password=${DB_PASSWORD:gestionale}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/gestionale}
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.jdbc.min-size=2

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER:gestionale}
%prod.quarkus.datasource.password=${DB_PASSWORD:gestionale}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/gestionale}
%prod.quarkus.datasource.jdbc.max-size=16
%prod.quarkus.datasource.jdbc.min-size=2

# ===================================================================
# Local / Dev Profile Configuration (File-based Embedded H2 Database)
# Automatically creates the database file (./data/gestionale.mv.db) if not existent
# ===================================================================
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=
%dev.quarkus.datasource.jdbc.url=${LOCAL_DB_URL:jdbc:h2:file:./data/gestionale;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE}
%dev.quarkus.datasource.jdbc.max-size=8
%dev.quarkus.datasource.jdbc.min-size=1
%dev.quarkus.liquibase.migrate-at-start=true

# ===================================================================
# Test Profile Configuration (In-Memory H2 in PostgreSQL Mode)
# ===================================================================
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.liquibase.migrate-at-start=true

# ===================================================================
# Liquibase Database Migration Configuration
# ===================================================================
# Automatically run Liquibase migrations at application startup
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml
quarkus.liquibase.validate-on-migrate=true
quarkus.liquibase.clean-at-start=false

# ===================================================================
# Hibernate ORM Configuration
# ===================================================================
# Schema generation is managed entirely by Liquibase
quarkus.hibernate-orm.schema-generation.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true


