# ===================================================================
# Gestionale Paola - Quarkus Application Configuration
# ===================================================================

# HTTP Configuration
quarkus.http.port=8080
# Global prefix for all REST endpoints (management endpoints under /q stay put).
quarkus.rest.path=/api

# ===================================================================
# Production / Default Datasource Configuration (PostgreSQL)
# ===================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:gestionale}
quarkus.datasource.password=${DB_PASSWORD:gestionale}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/gestionale}
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.jdbc.min-size=2

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER:gestionale}
%prod.quarkus.datasource.password=${DB_PASSWORD:gestionale}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/gestionale}
%prod.quarkus.datasource.jdbc.max-size=16
%prod.quarkus.datasource.jdbc.min-size=2

# ===================================================================
# Local / Dev Profile Configuration (File-based Embedded H2 Database)
# Automatically creates the database file (./data/gestionale.mv.db) if not existent
# ===================================================================
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=
%dev.quarkus.datasource.jdbc.url=${LOCAL_DB_URL:jdbc:h2:file:./data/gestionale;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE}
%dev.quarkus.datasource.jdbc.max-size=8
%dev.quarkus.datasource.jdbc.min-size=1
%dev.quarkus.liquibase.migrate-at-start=true

# ===================================================================
# Test Profile Configuration (In-Memory H2 in PostgreSQL Mode)
# ===================================================================
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.liquibase.migrate-at-start=true

# ===================================================================
# Liquibase Database Migration Configuration
# ===================================================================
# Automatically run Liquibase migrations at application startup
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml
quarkus.liquibase.validate-on-migrate=true
quarkus.liquibase.clean-at-start=false

# ===================================================================
# Hibernate ORM Configuration
# ===================================================================
# Schema generation is managed entirely by Liquibase
quarkus.hibernate-orm.schema-generation.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true



# ===================================================================
# CORS (frontend paola_gestionale runs on a different origin in dev)
# ===================================================================
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8100}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=location
quarkus.http.cors.access-control-max-age=24H

# ===================================================================
# OpenAPI / Swagger UI
# ===================================================================
# Swagger UI is enabled in dev at /q/swagger-ui; keep it available in prod too.
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# ===================================================================
# JSON serialization
# ===================================================================
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.fail-on-unknown-properties=false

# ===================================================================
# JWT Authentication (SmallRye JWT)
# ===================================================================
# Issuer embedded in and verified on every token.
mp.jwt.verify.issuer=https://gestionale.pirris.com
# Public key used to VERIFY incoming tokens (safe to ship in the classpath).
mp.jwt.verify.publickey.location=jwtRS256.pub
# Private key used to SIGN tokens we issue. In prod override with an env var /
# secret (e.g. smallrye.jwt.sign.key.location=file:///run/secrets/jwt-key).
smallrye.jwt.sign.key.location=jwtRS256.key
# Token lifetime (seconds): 8 hours.
gestionale.jwt.duration-seconds=28800

# ===================================================================
# HTTP authorization policies (deny by default on /api)
# ===================================================================
# Public: login. (Admin account provisioning is role-guarded at /api/admin.)
quarkus.http.auth.permission.public.paths=/api/auth/login
quarkus.http.auth.permission.public.policy=permit
# Everything else under /api requires a valid JWT.
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
# Dev tooling stays open (swagger-ui, openapi, health live under /q).
quarkus.http.auth.permission.tooling.paths=/q/*
quarkus.http.auth.permission.tooling.policy=permit
